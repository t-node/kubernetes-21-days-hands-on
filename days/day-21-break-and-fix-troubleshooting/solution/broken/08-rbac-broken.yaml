# Scenario 8: a reporting pod that needs to list Deployments, with a Role that
# looks correct and is not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting
  namespace: devboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reporting
  namespace: devboard
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporting
  namespace: devboard
subjects:
  - kind: ServiceAccount
    name: reporting
    namespace: devboard
roleRef:
  kind: Role
  name: reporting
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: reporting
  namespace: devboard
spec:
  serviceAccountName: reporting
  automountServiceAccountToken: true
  containers:
    - name: kubectl
      image: bitnami/kubectl:1.31
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 128Mi }
