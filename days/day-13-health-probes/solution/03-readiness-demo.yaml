# Watch readiness pull a pod out of a Service WITHOUT restarting it.
#
#   kubectl get pods,endpoints -n devboard -l demo=readiness -w
#
# At ~30s: READY goes 1/1 -> 0/1, ENDPOINTS goes populated -> <none>,
# and RESTARTS STAYS 0. That contrast with 02-liveness-demo is the whole lesson.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: devboard
  labels:
    demo: readiness
    app: readiness-demo
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
          name: http
      command:
        - sh
        - -c
        - "touch /tmp/ready; (sleep 30; rm -f /tmp/ready) & nginx -g 'daemon off;'"
      readinessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
  namespace: devboard
spec:
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: http
