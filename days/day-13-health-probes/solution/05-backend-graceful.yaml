# 01-backend-probes-exec.yaml PLUS graceful shutdown.
#
# When a pod is deleted, endpoint removal and SIGTERM happen IN PARALLEL.
# Endpoint removal is asynchronous -- kube-proxy on every node has to update.
# Without a preStop delay, the app can stop accepting connections while some
# nodes are still sending it traffic, producing 502s during a rolling update.
#
# Test: run a curl loop, then `kubectl rollout restart deployment/backend`.
# With the preStop hook you should see an unbroken stream of 200s.
#
# THE FIX for DevBoard's probe design.
#
#   liveness  -> /health   : the PROCESS only. Never a dependency. (unchanged)
#   readiness -> exec      : ALSO verifies Postgres is reachable, so a database
#                            outage removes pods from the Service instead of
#                            restarting them.
#
# Result when Postgres goes away:  READY 0/1, RESTARTS 0, ENDPOINTS <none>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devboard
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      automountServiceAccountToken: false
      # SIGTERM to SIGKILL budget. Includes the preStop hook.
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres ..."
                sleep 2
              done
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }

      containers:
        - name: backend
          image: devboard-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: PORT }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_DB }
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_SSLMODE }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devboard-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"

          # LIVENESS: is this Go process wedged? Nothing else.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3          # ~30s to detect a hang

          # READINESS: can this pod actually SERVE?
          # Two checks: the app answers locally, AND Postgres accepts TCP.
          # `nc -z` is available in the Alpine runtime image.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "wget -q -O /dev/null http://127.0.0.1:${PORT}/health && nc -z ${POSTGRES_HOST} ${POSTGRES_PORT}"
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2          # ~10s to leave rotation

          # Sleep for longer than endpoint propagation takes, THEN let the
          # app shut down. Crude, and it is what most production deployments
          # actually do.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
