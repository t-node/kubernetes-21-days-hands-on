# The same backend, but ALSO mounting the Secret as a file so you can inspect
# the tmpfs behaviour:
#
#   kubectl exec -n devboard deploy/backend -- df -h /etc/secrets
#
# The Go app still reads the password from POSTGRES_URL (an env var) because
# that is all it supports. An application honouring the common *_FILE
# convention could drop the env var entirely -- which is the shape to aim for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: secrets
          secret:
            secretName: devboard-secrets
            defaultMode: 0400      # owner read-only

      containers:
        - name: backend
          image: devboard-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: PORT }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_DB }
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_SSLMODE }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devboard-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
