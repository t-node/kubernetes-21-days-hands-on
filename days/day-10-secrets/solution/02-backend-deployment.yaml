# THE MAIN EXERCISE: assemble POSTGRES_URL from ConfigMap + Secret pieces.
#
# The Go backend wants a single DSN containing the password. Rather than
# storing the whole URL in a Secret (which would duplicate host/port/db/user),
# each component is pulled into its own env var and the DSN is composed with
# $(VAR) interpolation.
#
# RULES for $(VAR):
#   - the referenced variable must be defined EARLIER in this same env list
#   - variables from envFrom are NOT reliably available -- define them explicitly
#   - an unresolvable $(FOO) is left LITERALLY in the value, with no error
#   - escape a literal dollar sign as $$
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      # This app never calls the Kubernetes API, so do not give it a token.
      automountServiceAccountToken: false

      containers:
        - name: backend
          image: devboard-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          env:
            # ---- the pieces, defined FIRST so they can be interpolated ----
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: PORT }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_DB }
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_SSLMODE }

            # the ONLY value that comes from the Secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devboard-secrets, key: POSTGRES_PASSWORD }

            # ---- and now the composed DSN ----
            - name: POSTGRES_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"

          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
