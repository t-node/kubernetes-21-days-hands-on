# A throwaway pod with the SAME env block as the backend, but a container that
# just prints and sleeps. Lets you see the interpolated DSN before Postgres
# exists (the real backend would CrashLoop).
apiVersion: v1
kind: Pod
metadata:
  name: dsn-demo
  namespace: devboard
spec:
  automountServiceAccountToken: false
  volumes:
    - name: secrets
      secret:
        secretName: devboard-secrets
        defaultMode: 0400
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "env | grep -E '^POSTGRES' | sort; echo '--- mounted ---'; ls -la /etc/secrets; sleep 3600"]
      env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef: { name: devboard-config, key: POSTGRES_DB }
        - name: POSTGRES_SSLMODE
          valueFrom:
            configMapKeyRef: { name: devboard-config, key: POSTGRES_SSLMODE }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: devboard-secrets, key: POSTGRES_PASSWORD }
        - name: POSTGRES_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"
      volumeMounts:
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true
