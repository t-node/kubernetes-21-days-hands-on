# stringData is WRITE-ONLY: you supply plaintext, the API server base64-encodes
# it into `data`, and reading the object back shows only `data`.
#
# It avoids two very common bugs:
#   - encoding the value incorrectly
#   - `echo` appending a newline that becomes part of the password
#
# In real life this file would NOT hold plaintext. It would be a SealedSecret,
# a SOPS-encrypted file, or an ExternalSecret pointing at AWS Secrets Manager
# or Vault. See section 10.3.
apiVersion: v1
kind: Secret
metadata:
  name: devboard-secrets
  namespace: devboard
type: Opaque
stringData:
  # Matches the upstream .env.example default so the app works out of the box.
  POSTGRES_PASSWORD: "devboard"
