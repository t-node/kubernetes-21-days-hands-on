# ServiceAccounts are REAL API objects -- identities for PODS.
# (Users and Groups are not objects at all; they are strings the authenticator
# asserts. See section 19.1.)
#
# A new ServiceAccount has NO permissions. Verify:
#   kubectl auth can-i list pods -n devboard \
#     --as=system:serviceaccount:devboard:devboard-intern    -> no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-intern
  namespace: devboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-admin
  namespace: devboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-auditor
  namespace: devboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-configreader
  namespace: devboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-podreader
  namespace: devboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-execer
  namespace: devboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devboard-wrong
  namespace: devboard
