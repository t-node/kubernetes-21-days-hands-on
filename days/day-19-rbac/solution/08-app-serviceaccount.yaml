# LEAST PRIVILEGE for an application: one ServiceAccount, one Role, one verb on
# one resource -- and by name.
#
# The `resourceNames` field narrows it further: this identity can read exactly
# the ConfigMap `devboard-config`, not every ConfigMap in the namespace.
# (Caveat: resourceNames cannot restrict `list` or `watch`, only named gets.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: devboard
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["devboard-config"]
    verbs: ["get"]
  # `list` is needed for `kubectl get configmaps` and cannot be name-restricted.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configmap-reader-binding
  namespace: devboard
subjects:
  - kind: ServiceAccount
    name: devboard-configreader
    namespace: devboard
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  namespace: devboard
  labels:
    demo: rbac
spec:
  serviceAccountName: devboard-configreader
  automountServiceAccountToken: true
  containers:
    - name: kubectl
      image: bitnami/kubectl:1.31
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 128Mi }
