# Pods that run kubectl AS a ServiceAccount, so you can see RBAC deny a real
# command rather than only reading `auth can-i` output.
#
#   kubectl exec -n devboard rbac-intern -- kubectl get pods -n devboard      # works
#   kubectl exec -n devboard rbac-intern -- kubectl delete pod X -n devboard  # Forbidden
apiVersion: v1
kind: Pod
metadata:
  name: rbac-intern
  namespace: devboard
  labels:
    demo: rbac
spec:
  serviceAccountName: devboard-intern     # <- the identity this pod runs as
  automountServiceAccountToken: true      # required: this pod DOES call the API
  containers:
    - name: kubectl
      image: bitnami/kubectl:1.31
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: rbac-admin
  namespace: devboard
  labels:
    demo: rbac
spec:
  serviceAccountName: devboard-admin
  automountServiceAccountToken: true
  containers:
    - name: kubectl
      image: bitnami/kubectl:1.31
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 128Mi }
