# Step 6: enough load to exhaust the cluster, so you can see the HPA hit a wall
# it cannot fix.
#
# Some backend pods end up Pending with "Insufficient cpu". The HPA worked
# perfectly -- it simply cannot add NODES. That is the Cluster Autoscaler's job,
# and kind has none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator-heavy
  namespace: devboard
  labels:
    app: load-generator-heavy
spec:
  replicas: 24
  selector:
    matchLabels:
      app: load-generator-heavy
  template:
    metadata:
      labels:
        app: load-generator-heavy
    spec:
      containers:
        - name: loader
          image: busybox:1.36
          command:
            - sh
            - -c
            - "while true; do wget -q -O /dev/null http://backend:8080/tasks || true; done"
          resources:
            requests: { cpu: 20m,  memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
