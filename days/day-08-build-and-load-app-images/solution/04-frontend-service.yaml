apiVersion: v1
kind: Service
metadata:
  name: devboard-frontend
  namespace: devboard
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80          # Service port
      targetPort: http  # the container's 4173
      nodePort: 30080   # mapped to localhost:30080 by cluster/kind-config.yaml
