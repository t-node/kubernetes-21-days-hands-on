apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devboard
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: devboard-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            # vite preview --port 4173. This is the number from the transcript.
            - containerPort: 4173
              name: http

          # The SPA is static assets, so "/" is a fine health target. It says
          # nothing about whether the backend is reachable -- deliberately, so
          # a backend outage does not restart every frontend pod.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
