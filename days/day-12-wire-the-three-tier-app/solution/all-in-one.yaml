# DevBoard: the complete three-tier application in one file.
#
# Generated by concatenating 00- through 06- with --- separators.
# Deploy the whole stack:   kubectl apply -f all-in-one.yaml
# Tear it all down:         kubectl delete -f all-in-one.yaml
#
# Requires the images to exist on the nodes first:
#   bash app/build-images.sh 1.0

---
apiVersion: v1
kind: Namespace
metadata:
  name: devboard
  labels:
    project: devboard
    environment: learning

---
# Non-sensitive configuration for every tier.
# The password is NOT here -- see 02-secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: devboard-config
  namespace: devboard
data:
  # Every value must be a STRING. Unquoted 8080 is an int64 and is rejected.
  PORT: "8080"
  POSTGRES_HOST: "postgres"      # must equal the Postgres Service name
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "devboard"
  POSTGRES_USER: "devboard"
  POSTGRES_SSLMODE: "disable"

---
# In real life: a SealedSecret, a SOPS-encrypted file, or an ExternalSecret.
# Plaintext here so the course is self-contained.
apiVersion: v1
kind: Secret
metadata:
  name: devboard-secrets
  namespace: devboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: "devboard"

---
# The REAL DevBoard schema and seed data, from
# app/devboard/init/postgres/  (upstream: github.com/t-node/devboard)
#
# Mounted at /docker-entrypoint-initdb.d/ in the Postgres container. The
# official image runs every *.sql there in ALPHABETICAL order -- but ONLY when
# the data directory is empty, i.e. the first boot against a fresh volume.
# Hence the 01_/02_ prefixes.
#
# PREFER generating this from the real files so there is one source of truth:
#   kubectl create configmap postgres-init -n devboard --from-file=app/devboard/init/postgres/ --dry-run=client -o yaml | kubectl apply -f -
#
# This committed copy exists so the repo works without fetching the source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: devboard
data:
  01_schema.sql: |
    -- DevBoard (advanced branch) — minimal schema: projects + tasks only.
    -- No users table: this branch has no auth. assignee_id is just an int label.

    CREATE TABLE IF NOT EXISTS projects (
        id          SERIAL PRIMARY KEY,
        name        VARCHAR(200) NOT NULL,
        description TEXT,
        owner_id    INTEGER,
        created_at  TIMESTAMPTZ  NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS tasks (
        id          SERIAL PRIMARY KEY,
        title       VARCHAR(300) NOT NULL,
        description TEXT,
        project_id  INTEGER NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
        assignee_id INTEGER,
        status      VARCHAR(20) NOT NULL DEFAULT 'todo'
                    CHECK (status IN ('todo','in_progress','blocked','done')),
        priority    VARCHAR(10) NOT NULL DEFAULT 'medium'
                    CHECK (priority IN ('low','medium','high')),
        due_date    DATE,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_tasks_project_id ON tasks(project_id);
    CREATE INDEX IF NOT EXISTS idx_tasks_status     ON tasks(status);

    -- Auto-update updated_at on row modifications.
    CREATE OR REPLACE FUNCTION touch_updated_at() RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS tasks_touch_updated_at ON tasks;
    CREATE TRIGGER tasks_touch_updated_at
        BEFORE UPDATE ON tasks
        FOR EACH ROW
        EXECUTE FUNCTION touch_updated_at();

  02_seed.sql: |
    -- Seed data so the UI has something to render on first boot.
    -- Mirrors the fundamentals branch's mock store: "DevBoard MVP" (id 1) with
    -- 8 tasks across statuses, plus a small second project.

    INSERT INTO projects (id, name, description, owner_id) VALUES
        (1, 'DevBoard MVP',   'Ship the v1 task tracker', 1),
        (2, 'Marketing Site', 'Landing page + launch blog', 1)
    ON CONFLICT (id) DO NOTHING;

    INSERT INTO tasks (title, description, project_id, assignee_id, status, priority, due_date) VALUES
        ('Design the task schema',     'projects, tasks, statuses',     1, 1, 'done',        'high',   '2026-05-05'),
        ('Build the kanban board',     'drag and drop columns',         1, 2, 'in_progress', 'high',   '2026-06-18'),
        ('Wire up the dashboard hero', 'velocity + chip stats',         1, 1, 'in_progress', 'medium', '2026-06-20'),
        ('Add the command bar',        'global search',                 1, 3, 'todo',        'medium', '2026-06-25'),
        ('Dark mode polish',           'grain + gradients',             1, 2, 'todo',        'low',    NULL),
        ('Fix flaky avatar colors',    'hash collision on initials',    1, 1, 'blocked',     'high',   '2026-06-15'),
        ('Write component tests',      'Vitest + testing-library',      1, 3, 'todo',        'medium', NULL),
        ('Ship the v1 release',        'tag and announce',              1, 1, 'todo',        'high',   '2026-06-30'),
        ('Draft the launch blog post', '',                              2, 2, 'in_progress', 'medium', '2026-06-22'),
        ('Hero illustration',          '',                              2, 3, 'todo',        'low',    NULL);

    -- Keep the projects sequence past the explicit ids we inserted.
    SELECT setval('projects_id_seq', (SELECT MAX(id) FROM projects));


---
# Postgres, tier 3.
#
# STILL DELIBERATELY IMPERFECT:
#   emptyDir       -> Day 14 replaces it with a PersistentVolumeClaim
#   kind: Deployment -> Day 15 replaces it with a StatefulSet
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devboard
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two postmasters on one data directory
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: data
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devboard-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata     # the subdirectory trick
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres            # must equal POSTGRES_HOST in devboard-config
  namespace: devboard
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
# Backend, tier 2. Go + Gin.
#
# New today: the INIT CONTAINER, which is Kubernetes' answer to
# `depends_on: {postgres: {condition: service_healthy}}` in docker-compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devboard
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      automountServiceAccountToken: false

      initContainers:
        # Blocks until Postgres accepts connections. The app container does not
        # start until this exits 0, so you get a clear Init:0/1 status instead
        # of a CrashLoopBackOff full of retry noise.
        #
        # It only proves what you tell it to check -- it verifies the `postgres`
        # Service, not whatever POSTGRES_URL happens to say.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres at $POSTGRES_HOST:$POSTGRES_PORT ..."
                sleep 2
              done
              echo "postgres is ready"
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }

      containers:
        - name: backend
          image: devboard-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          env:
            # the pieces, defined first so $(VAR) can interpolate them
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: PORT }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_USER }
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_PORT }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_DB }
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef: { name: devboard-config, key: POSTGRES_SSLMODE }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devboard-secrets, key: POSTGRES_PASSWORD }
            # the composed DSN
            - name: POSTGRES_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"

          # NOTE: /health does NOT check the database. Correct for liveness,
          # WRONG for readiness -- these pods stay in the Service endpoints even
          # when Postgres is unreachable. Day 13 fixes exactly this.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  # NOT a free choice: the frontend image proxies /api to http://backend:8080
  name: backend
  namespace: devboard
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http

---
# Frontend, tier 1. React + Vite, served by `vite preview` on :4173.
# It also reverse-proxies /api/* to http://backend:8080/* with /api stripped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devboard
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: devboard-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4173
              name: http
          # "/" is static asset serving. It deliberately says nothing about the
          # backend, so a backend outage does not restart every frontend pod.
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  # This name IS free -- nothing inside any image refers to it. Only the
  # nodePort matters to the browser.
  name: devboard-frontend
  namespace: devboard
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80          # Service port
      targetPort: http  # container 4173
      nodePort: 30080   # -> localhost:30080 via cluster/kind-config.yaml

