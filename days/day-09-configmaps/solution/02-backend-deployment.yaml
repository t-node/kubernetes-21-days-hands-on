# Backend configured from the ConfigMap.
#
# POSTGRES_URL is still hardcoded here because it contains the password.
# Day 10 rebuilds it from ConfigMap + Secret pieces using $(VAR) interpolation,
# which is the interesting part -- come back and diff the two files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
        - name: backend
          image: devboard-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          envFrom:
            # Imports PORT, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB,
            # POSTGRES_USER, POSTGRES_SSLMODE, DEMO_SETTING.
            # The Go app only reads PORT; the rest are here so Day 10 can
            # assemble POSTGRES_URL from them.
            - configMapRef:
                name: devboard-config

          env:
            # `env` always wins over `envFrom` on a key collision.
            - name: POSTGRES_URL
              value: "postgres://devboard:devboard@postgres:5432/devboard?sslmode=disable"

          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
