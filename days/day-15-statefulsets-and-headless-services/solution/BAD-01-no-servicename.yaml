# Break It A: spec.serviceName is MANDATORY on a StatefulSet.
#
#   kubectl apply -f BAD-01-no-servicename.yaml
#   -> error: spec.serviceName: Required value
#
# Unlike most StatefulSet mistakes, this one is caught at admission.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: no-servicename
  namespace: devboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-servicename
  template:
    metadata:
      labels:
        app: no-servicename
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
