# The GOVERNING service for the StatefulSet -- referenced by spec.serviceName.
#
# clusterIP: None means:
#   - no virtual IP, no kube-proxy rules, no load balancing
#   - DNS returns the pod IPs directly
#   - AND, for a StatefulSet, per-pod records are created:
#       postgres-0.postgres-headless.devboard.svc.cluster.local
#
# That per-pod name is what makes "replicate from postgres-0" expressible.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: devboard
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  # Give pods DNS records before they are Ready, so peers can find each other
  # during cluster bootstrap.
  publishNotReadyAddresses: true
