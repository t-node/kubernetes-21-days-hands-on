# A Service whose selector matches nothing.
#
# It still gets a ClusterIP and still gets iptables rules -- rules that REJECT.
# `curl` returns connection refused immediately rather than hanging, which is
# the signature of "the Service exists and has no backends" (23.6).
apiVersion: v1
kind: Service
metadata:
  name: web-broken
  namespace: cka23
spec:
  selector:
    app: web-typo          # nothing carries this label
  ports:
    - {port: 80, targetPort: 80}
