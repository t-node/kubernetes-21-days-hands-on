# dnsPolicy: Default means "inherit the NODE's resolv.conf".
#
# The pod can resolve internet names and CANNOT resolve any Service -- there is
# no cluster nameserver and no search list. Compare its /etc/resolv.conf with
# the dnsutils pod's.
apiVersion: v1
kind: Pod
metadata:
  name: dns-default
  namespace: cka24
spec:
  dnsPolicy: Default
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      imagePullPolicy: IfNotPresent
