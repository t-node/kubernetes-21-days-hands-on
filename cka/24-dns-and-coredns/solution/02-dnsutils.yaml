# The DNS debugging pod from the Kubernetes documentation. It ships dig, host
# and a POSIX nslookup that honours the search list -- busybox's does not,
# which is why a busybox nslookup often "fails" on names that resolve fine.
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: cka24
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      imagePullPolicy: IfNotPresent
      resources:
        requests: {cpu: "10m", memory: "32Mi"}
