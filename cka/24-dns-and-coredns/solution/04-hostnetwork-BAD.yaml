# hostNetwork: true with no dnsPolicy.
#
# It silently defaults to `Default`, so this pod uses the NODE's resolver and
# cannot resolve a single Service -- the trap in 24.5. Nothing about the pod
# spec hints at it.
apiVersion: v1
kind: Pod
metadata:
  name: hostnet-broken
  namespace: cka24
spec:
  hostNetwork: true
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      imagePullPolicy: IfNotPresent
