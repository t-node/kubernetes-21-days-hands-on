# ndots: 1 -- the standard fix for a workload that mostly resolves EXTERNAL
# names. With the default ndots:5, `api.github.com` (2 dots) is tried against
# three cluster suffixes first, costing three NXDOMAINs per lookup.
#
# dnsPolicy stays ClusterFirst, so cluster names still work; dnsConfig only
# overrides the option.
apiVersion: v1
kind: Pod
metadata:
  name: dns-ndots1
  namespace: cka24
spec:
  dnsPolicy: ClusterFirst
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      imagePullPolicy: IfNotPresent
