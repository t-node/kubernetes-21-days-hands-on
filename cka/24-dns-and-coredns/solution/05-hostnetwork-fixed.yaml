# The same pod, with the one line that fixes it.
apiVersion: v1
kind: Pod
metadata:
  name: hostnet-fixed
  namespace: cka24
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet     # <- the whole fix
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      imagePullPolicy: IfNotPresent
