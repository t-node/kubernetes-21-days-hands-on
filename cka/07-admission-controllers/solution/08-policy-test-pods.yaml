# Three pods for the policy test. Apply them ONE AT A TIME into a namespace
# labelled policy=enforce and then into one labelled policy=warn, and compare.
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  labels: {owner: platform}
spec:
  containers:
    - name: app
      image: nginx:alpine            # explicit tag, not :latest
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag-pod
  labels: {owner: platform}
spec:
  containers:
    - name: app
      image: nginx:latest            # violates rule 1
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: unlabelled-pod
spec:
  containers:
    - name: app
      image: nginx:alpine            # violates rule 3 -- no owner label
      command: ["sleep", "3600"]
