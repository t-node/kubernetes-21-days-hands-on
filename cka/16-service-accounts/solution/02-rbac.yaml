# Permissions for dashboard-sa. Note the subject: kind ServiceAccount, with a
# namespace -- NOT kind User with the system:serviceaccount:... string. Both
# work; this form is the readable one.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: cka16
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-sa-reads-pods
  namespace: cka16
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: cka16
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
