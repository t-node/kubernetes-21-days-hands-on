# Three ServiceAccounts with different postures.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: cka16
---
# This one refuses to hand a token to any pod that uses it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-token-sa
  namespace: cka16
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy-sa
  namespace: cka16
