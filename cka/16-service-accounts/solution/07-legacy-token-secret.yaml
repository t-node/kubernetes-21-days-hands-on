# The pre-1.24 style: a hand-made Secret that a controller fills with a JWT
# carrying NO EXPIRY.
#
# Create this only when something genuinely cannot refresh a token. It is a
# permanent credential in etcd, readable by anyone with `get secrets` here.
apiVersion: v1
kind: Secret
metadata:
  name: legacy-sa-token
  namespace: cka16
  annotations:
    kubernetes.io/service-account.name: legacy-sa
type: kubernetes.io/service-account-token
