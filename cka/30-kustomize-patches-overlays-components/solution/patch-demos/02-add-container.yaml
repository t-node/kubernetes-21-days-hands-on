# The same mechanism used to ADD rather than modify: this name matches nothing
# in the base, so it becomes a third container (30.5).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: log-shipper
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
