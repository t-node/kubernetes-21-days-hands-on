apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api, tier: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, tier: backend}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 80}
            - {name: metrics, containerPort: 9090}
          env:
            - {name: LOG_LEVEL, value: "info"}
            - {name: REGION, value: "local"}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
        # A second container, so the list-merge and $patch: delete demos have
        # something to work on (30.5).
        - name: legacy-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api, tier: backend}
spec:
  selector: {app: api}
  ports: [{name: http, port: 80, targetPort: http}]
