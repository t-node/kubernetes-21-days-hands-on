# Adds an exporter sidecar to EVERY Deployment this component is applied to.
# The target in kustomization.yaml selects them; this file says what to add.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder      # overridden by the target selector
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: metrics-exporter
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          ports:
            - {name: exporter, containerPort: 9100}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
