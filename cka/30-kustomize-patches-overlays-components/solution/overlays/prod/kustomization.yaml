apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cka30-prod
namePrefix: prod-

resources:
  - ../../base

# prod opts in to BOTH features. Order matters: external-db adds the postgres
# Deployment first, so monitoring's `name: ".*"` target then reaches it too
# (30.8).
components:
  - ../../components/external-db
  - ../../components/monitoring

patches:
  - path: replicas-patch.yaml
  - path: drop-legacy-sidecar.yaml
  - path: resources-patch.yaml
    target:
      kind: Deployment
      name: web

labels:
  - pairs:
      environment: production
    includeSelectors: false      # CKA 29: never put a changing value in a selector

images:
  - name: nginx
    newTag: "1.27.2-alpine"
