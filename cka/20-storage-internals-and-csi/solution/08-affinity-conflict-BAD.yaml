# DELIBERATELY UNSCHEDULABLE.
#
# local-pv-manual has nodeAffinity for devops-worker; this pod insists on
# devops-worker2. The volume cannot move and the pod will not, so the pod sits
# Pending with:
#
#   0/3 nodes are available: 1 node(s) had volume node affinity conflict, ...
#
# That message is the signature of storage having chosen a node the scheduler
# cannot honour (20.6).
apiVersion: v1
kind: Pod
metadata:
  name: wrong-node
  namespace: cka20
spec:
  nodeSelector:
    kubernetes.io/hostname: devops-worker2
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: local-pvc
