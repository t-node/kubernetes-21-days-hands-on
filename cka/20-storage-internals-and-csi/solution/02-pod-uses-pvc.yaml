# The consumer that unblocks the PVC above. The scheduler places this pod
# first; only then is the volume created, on whichever node it landed.
apiVersion: v1
kind: Pod
metadata:
  name: uses-pvc
  namespace: cka20
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-wffc
