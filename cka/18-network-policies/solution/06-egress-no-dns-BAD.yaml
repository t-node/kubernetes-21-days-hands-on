# DELIBERATELY BROKEN -- the trap from 18.5.
#
# It allows web -> api on TCP 80 and nothing else. Because the pod is now
# isolated for egress, DNS is blocked too, so `curl http://api` fails with
# "Could not resolve host" -- an error that looks nothing like a policy problem.
#
# The connection to the api's IP address still works, which is the diagnostic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-egress-broken
  namespace: cka18
spec:
  podSelector:
    matchLabels:
      role: web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: api
      ports:
        - protocol: TCP
          port: 80
