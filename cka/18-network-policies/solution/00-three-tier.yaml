# A three-tier application whose only job is to be probed.
#
#   web -> api -> db     and, by default, web -> db as well
#
# Each tier is an nginx serving its own name, plus a netshoot-free client:
# nginx:alpine has no curl, so the CLIENTS are curlimages/curl and the SERVERS
# are nginx. That split keeps every image small and every test one command.
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: cka18
  labels: {role: web, tier: frontend}
spec:
  containers:
    - name: c
      image: curlimages/curl:8.10.1
      command: ["sleep", "36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: cka18
  labels: {role: api, tier: backend}
spec:
  containers:
    - name: c
      image: curlimages/curl:8.10.1
      command: ["sleep", "36000"]
---
# db is a SERVER -- it listens, and the others connect to it.
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: cka18
  labels: {role: db, tier: data}
spec:
  containers:
    - name: c
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cka18
spec:
  selector: {role: db}
  ports:
    - {port: 80, targetPort: 80}
---
# A second listener so "allowed on one port, denied on another" is testable.
apiVersion: v1
kind: Pod
metadata:
  name: api-server
  namespace: cka18
  labels: {role: api, tier: backend}
spec:
  containers:
    - name: c
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cka18
spec:
  selector: {role: api}
  ports:
    - {port: 80, targetPort: 80}
