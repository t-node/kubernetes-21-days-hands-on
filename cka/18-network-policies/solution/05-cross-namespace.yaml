# Allow a pod from ANOTHER namespace.
#
# A bare podSelector in `from:` only ever matches pods in the policy's own
# namespace, so reaching across requires the namespaceSelector -- and the two
# must be in the SAME list item (AND), or you have allowed the whole namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-prod-api
  namespace: cka18
spec:
  podSelector:
    matchLabels:
      role: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              env: prod
          podSelector:
            matchLabels:
              role: api
      ports:
        - protocol: TCP
          port: 80
