# DELIBERATELY REFUSED. It targets the `restricted` listener from a namespace
# that does not carry gateway-access=true.
#
# The object is CREATED successfully. The refusal appears only in status:
#   Accepted=False, reason=NotAllowedByListeners
#
# That is the difference from Ingress, which fails silently (25.5).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-refused
  namespace: cka25
spec:
  parentRefs:
    - name: platform-gw
      namespace: cka25-infra
      sectionName: restricted
  hostnames: ["restricted.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: root, port: 80}
