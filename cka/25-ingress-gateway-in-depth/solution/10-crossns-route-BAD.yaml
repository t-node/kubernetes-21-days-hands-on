# Routes to a Service in ANOTHER namespace with no ReferenceGrant.
#
# Accepted=True (the listener allows it) but
# ResolvedRefs=False, reason=RefNotPermitted -- so it returns 500 and the
# reason is in status, not in a log (25.6).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-crossns
  namespace: cka25
spec:
  parentRefs:
    - name: platform-gw
      namespace: cka25-infra
      sectionName: open
  hostnames: ["open.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /data}
      backendRefs:
        - name: data-svc
          namespace: cka25-data      # a DIFFERENT namespace
          port: 80
