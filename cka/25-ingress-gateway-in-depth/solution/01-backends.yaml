# Three tiny backends that each report which one answered, so every routing
# decision in this assignment is visible in the response body.
---
apiVersion: v1
kind: ConfigMap
metadata: {name: pages, namespace: cka25}
data:
  root.html: "ROOT"
  api.html:  "API"
  v1.html:   "V1-HEALTH"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: root, namespace: cka25, labels: {app: root}}
spec:
  replicas: 2
  selector: {matchLabels: {app: root}}
  template:
    metadata: {labels: {app: root}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          command: ["sh","-c","echo ROOT-$HOSTNAME > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"]
          resources: {requests: {cpu: "10m", memory: "16Mi"}}
---
apiVersion: v1
kind: Service
metadata: {name: root, namespace: cka25}
spec:
  selector: {app: root}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: cka25, labels: {app: api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          # Echo the path the BACKEND received, so rewrites are observable.
          command:
            - sh
            - -c
            - |
              cat > /etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 80;
                location / {
                  default_type text/plain;
                  return 200 "API-$hostname path=$request_uri\n";
                }
              }
              EOF
              exec nginx -g 'daemon off;'
          resources: {requests: {cpu: "10m", memory: "16Mi"}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: cka25}
spec:
  selector: {app: api}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: health, namespace: cka25, labels: {app: health}}
spec:
  replicas: 1
  selector: {matchLabels: {app: health}}
  template:
    metadata: {labels: {app: health}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          command: ["sh","-c","echo HEALTH-EXACT > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"]
          resources: {requests: {cpu: "10m", memory: "16Mi"}}
---
apiVersion: v1
kind: Service
metadata: {name: health, namespace: cka25}
spec:
  selector: {app: health}
  ports: [{name: http, port: 80, targetPort: 80}]
