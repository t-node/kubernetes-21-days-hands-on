# Attaches to the `open` listener, which permits any namespace.
# Expect status.parents[0].conditions Accepted=True.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-open
  namespace: cka25
spec:
  parentRefs:
    - name: platform-gw
      namespace: cka25-infra
      sectionName: open
  hostnames: ["open.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: root, port: 80}
