apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web, tier: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, tier: frontend}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          env:
            - name: API_URL
              value: http://api:80        # another cross-object reference
          envFrom:
            # Refers to the GENERATED ConfigMap. Kustomize rewrites this to the
            # hashed name, which is what makes the Deployment roll on a config
            # change (29.7).
            - configMapRef:
                name: app-config
          resources:
            requests: {cpu: 10m, memory: 16Mi}
