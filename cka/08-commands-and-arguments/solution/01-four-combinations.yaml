# The complete truth table, one pod per row.
# Image: ENTRYPOINT ["sleep"], CMD ["5"]
#
#   kubectl apply -f 01-four-combinations.yaml
#   for p in sleeper-defaults sleeper-args sleeper-command sleeper-both; do
#     printf "%-20s -> %s\n" "$p" \
#       "$(kubectl exec $p -- cat /proc/1/cmdline 2>/dev/null | tr '\0' ' ')"
#   done
---
# ROW 1: neither field. Both image defaults apply -> sleep 5
apiVersion: v1
kind: Pod
metadata:
  name: sleeper-defaults
  labels: { demo: cmdargs }
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: ubuntu-sleeper:1.0
      imagePullPolicy: IfNotPresent
---
# ROW 2: args only. Replaces CMD, KEEPS ENTRYPOINT -> sleep 10
apiVersion: v1
kind: Pod
metadata:
  name: sleeper-args
  labels: { demo: cmdargs }
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: ubuntu-sleeper:1.0
      imagePullPolicy: IfNotPresent
      args: ["10"]                 # quoted -- an int here is rejected
---
# ROW 3: command only. Replaces ENTRYPOINT and *** DISCARDS CMD ***
#
# THIS IS THE TRAP. The result is `sleep` with NO argument, so the container
# exits with "sleep: missing operand". The image was fine; the pod spec removed
# its arguments.
apiVersion: v1
kind: Pod
metadata:
  name: sleeper-command
  labels: { demo: cmdargs }
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: ubuntu-sleeper:1.0
      imagePullPolicy: IfNotPresent
      command: ["sleep"]           # no args -> CMD ["5"] is thrown away
---
# ROW 4: both. Everything replaced -> sleep 60
apiVersion: v1
kind: Pod
metadata:
  name: sleeper-both
  labels: { demo: cmdargs }
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: ubuntu-sleeper:1.0
      imagePullPolicy: IfNotPresent
      command: ["sleep"]
      args:    ["60"]
