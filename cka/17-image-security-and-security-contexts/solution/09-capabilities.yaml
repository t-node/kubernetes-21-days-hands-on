# Three containers, three capability postures. Compare `capsh --print` -- or,
# since busybox has no capsh, compare what each can actually DO.
apiVersion: v1
kind: Pod
metadata:
  name: capabilities-demo
  namespace: cka17
spec:
  containers:
    # (a) the default: root, but with most capabilities already dropped by the
    #     runtime. It cannot set the clock.
    - name: default-caps
      image: busybox:1.36
      command: ["sleep", "3600"]

    # (b) SYS_TIME added back -- now it CAN set the clock
    - name: added-caps
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        capabilities:
          add: ["SYS_TIME"]

    # (c) everything dropped -- root in name only
    - name: no-caps
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        capabilities:
          drop: ["ALL"]
