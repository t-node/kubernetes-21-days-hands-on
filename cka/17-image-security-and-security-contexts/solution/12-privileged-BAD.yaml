# DELIBERATELY REJECTED once the namespace is labelled `restricted`.
#
# privileged: true gives every capability back plus host device access. Pod
# Security Admission blocks it at `baseline` and above -- so this pod is
# accepted in an unlabelled namespace and refused in cka17-restricted.
#
# Apply it to BOTH namespaces and compare the outcomes; that contrast is the
# whole point of 17.6.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: cka17-restricted
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
