# The form worth knowing: attach the pull secret to the ServiceAccount, and
# every pod using that account gets it with no workload YAML at all.
#
# The ServiceAccount admission controller merges it in -- the same mechanism
# that mounts the token in CKA 16.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cka17
imagePullSecrets:
  - name: regcred
