# readOnlyRootFilesystem with the scratch space an application actually needs.
#
# Writing anywhere under / fails; /tmp and /var/cache/nginx are emptyDir mounts
# and are writable. This is the two-line change that makes the field practical.
apiVersion: v1
kind: Pod
metadata:
  name: readonly-root
  namespace: cka17
spec:
  volumes:
    - name: tmp
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - {name: tmp, mountPath: /tmp}
