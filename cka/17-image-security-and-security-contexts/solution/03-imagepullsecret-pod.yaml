# The explicit form: name the secret on the pod.
# It still cannot pull (the registry is imaginary) -- but the FAILURE CHANGES,
# and that difference is the lesson.
apiVersion: v1
kind: Pod
metadata:
  name: has-credentials
  namespace: cka17
spec:
  imagePullSecrets:
    - name: regcred
  containers:
    - name: app
      image: registry.internal.example:5000/team/app:1.4
