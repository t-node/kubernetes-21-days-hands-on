# The full hardened baseline from 17.5, on a workload that actually runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened
  namespace: cka17-restricted
  labels: {app: hardened}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hardened}
  template:
    metadata:
      labels: {app: hardened}
    spec:
      automountServiceAccountToken: false     # CKA 16 -- it makes no API calls
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "id; sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
