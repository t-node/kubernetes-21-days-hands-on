# DELIBERATELY FAILS. busybox has no USER instruction, so it would run as UID 0,
# and runAsNonRoot refuses to let it start.
#
# Expected: CreateContainerConfigError, message
#   "container has runAsNonRoot and image will run as root"
#
# Note the failure happens BEFORE the process starts -- a policy that fails
# closed, which is the point.
apiVersion: v1
kind: Pod
metadata:
  name: nonroot-fails
  namespace: cka17
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
