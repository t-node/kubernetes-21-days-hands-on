# A per-environment values file. `-f` merges it over values.yaml; anything not
# mentioned keeps its default (28.1).
#
#   helm upgrade myapp ./solution/mychart -f solution/values-prod.yaml
replicaCount: 4

image:
  tag: "1.27-alpine"

service:
  type: ClusterIP
  port: 8080

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits:   {cpu: 200m, memory: 128Mi}

config:
  greeting: "hello from PRODUCTION values"
  environment: "prod"
  # A value that MUST be quoted to be legal in a ConfigMap -- the template's
  # `| quote` is what makes this work.
  debug: false

extraEnv:
  - name: LOG_LEVEL
    value: "warn"
  - name: REGION
    value: "eu-west-1"

ingress:
  enabled: true
  className: nginx
  host: mychart-prod.local

owner: "sre"
