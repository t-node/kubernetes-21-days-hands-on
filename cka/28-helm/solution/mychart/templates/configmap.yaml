apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mychart.fullname" . }}
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
data:
  # `range` over a MAP gives key and value. `quote` matters here: a value of
  # `true` or `8080` would otherwise render unquoted and fail, because every
  # value in a ConfigMap must be a string.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  release-info: |
    release:   {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
    revision:  {{ .Release.Revision }}
    chart:     {{ .Chart.Name }}-{{ .Chart.Version }}
    upgrade:   {{ .Release.IsUpgrade }}
