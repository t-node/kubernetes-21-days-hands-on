# Objects with the awkward properties real objects have: dotted annotation keys,
# several containers, named ports, resource limits and varied labels.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka32
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cka32
  labels: {app: web, tier: frontend, team: platform}
  annotations:
    # A dotted key -- JSONPath needs \. to read this (32.3)
    example.com/owner: platform-team
    monitoring.example.com/scrape: "true"
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata:
      labels: {app: web, tier: frontend, team: platform}
      annotations:
        example.com/owner: platform-team
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 80}
            - {name: metrics, containerPort: 9090}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 64Mi}
        # A second container, so `containers[*]` has something to iterate.
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cka32
  labels: {app: api, tier: backend, team: payments}
  annotations:
    example.com/owner: payments-team
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api, tier: backend, team: payments}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cka32
  labels: {app: web}
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30320}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cka32
  labels: {app: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cka32
type: Opaque
stringData:
  password: "s3cr3t-value"
  username: "appuser"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cka32
data:
  LOG_LEVEL: "info"
  TIMEOUT: "30"
---
# One pod that will never be Ready, so "which pods are not Ready" has an answer.
apiVersion: v1
kind: Pod
metadata:
  name: never-ready
  namespace: cka32
  labels: {app: broken, tier: frontend}
spec:
  containers:
    - name: c
      image: nginx:1.27-alpine
      readinessProbe:
        httpGet: {path: /nonexistent-path-so-this-never-passes, port: 80}
        periodSeconds: 5
      resources:
        requests: {cpu: 10m, memory: 16Mi}
