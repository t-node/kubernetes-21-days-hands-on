# Pattern 3: NATIVE SIDECAR -- an init container with restartPolicy: Always.
#
# It starts BEFORE the app (so it catches the first log line) and is stopped
# AFTER the app (so it catches the last one). Neither is possible with a plain
# second container.
apiVersion: v1
kind: Pod
metadata:
  name: with-sidecar
  namespace: cka10
spec:
  # Never, so the app container runs ONCE and the pod completes. Watch what
  # happens to the sidecar when it does -- before native sidecars existed, a
  # never-exiting second container kept a Job pod Running forever.
  restartPolicy: Never
  volumes:
    - name: logs
      emptyDir: {}
  initContainers:
    - name: log-shipper
      image: busybox:1.36
      restartPolicy: Always            # <- the field that makes this a sidecar
      command:
        - sh
        - -c
        - |
          echo "[shipper] up at $(date +%T) -- before the app"
          touch /var/log/app/out.log
          tail -F /var/log/app/out.log 2>/dev/null | while read line; do
            echo "[shipped] $line"
          done
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "[app] started at $(date +%T)" >> /var/log/app/out.log
          i=0
          while [ $i -lt 6 ]; do
            echo "[app] tick $i at $(date +%T)" >> /var/log/app/out.log
            i=$((i+1))
            sleep 5
          done
          echo "[app] finished" >> /var/log/app/out.log
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
