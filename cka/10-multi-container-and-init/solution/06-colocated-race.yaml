# The problem the sidecar pattern solves, made visible.
#
# Same two jobs as 05, but as plain co-located containers. The shipper has no
# guaranteed start order, so it may attach to the log file AFTER the app has
# already written its first lines -- and those lines are simply never shipped.
apiVersion: v1
kind: Pod
metadata:
  name: colocated-race
  namespace: cka10
spec:
  volumes:
    - name: logs
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "[app] FIRST LINE at $(date +%T)" >> /var/log/app/out.log
          sleep 3600
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
    - name: log-shipper
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          sleep 5                       # stands in for a slow start-up
          echo "[shipper] up at $(date +%T)"
          tail -f /var/log/app/out.log 2>/dev/null | while read line; do
            echo "[shipped] $line"
          done
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
