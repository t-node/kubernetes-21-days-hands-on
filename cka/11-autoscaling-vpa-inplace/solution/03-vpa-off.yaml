# updateMode: "Off" -- the recommender runs, nothing else does.
# Nothing is evicted, nothing is mutated. This is where every VPA rollout should
# start, and where most should stay.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hungry-vpa
  namespace: cka11
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hungry
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: "50m",  memory: "32Mi"}
        maxAllowed: {cpu: "300m", memory: "256Mi"}   # deliberately BINDING --
        # the app wants a whole core, so Target will be capped at 300m while
        # Uncapped Target shows what it really wanted. That gap is the lesson.
        controlledResources: ["cpu", "memory"]
