# updateMode: "Recreate" -- the updater now EVICTS pods whose resources are far
# from the recommendation, and the admission controller resizes the replacements
# on their way in.
#
# Apply this only after you have watched the recommendation appear under "Off".
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hungry-vpa
  namespace: cka11
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hungry
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: "50m",  memory: "32Mi"}
        maxAllowed: {cpu: "300m", memory: "256Mi"}
        controlledResources: ["cpu", "memory"]
